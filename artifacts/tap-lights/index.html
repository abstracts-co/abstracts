<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Lights</title>
<style>
  html, body { margin: 0; background: #070a14; }
  #stage {
    position: relative; height: 520px; overflow: hidden;
    cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .viewport, .viewport body { height: 100%; overflow: hidden; }
  .viewport #stage { height: 100vh; height: 100dvh; }
  #stage:focus { outline: none; }
  #stage:focus-visible { outline: 2px solid #8fb4ff; outline-offset: -4px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hint {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    color: #c9d4f2; font: 500 20px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .02em;
    transition: opacity .6s;
  }
  .lit #hint { opacity: 0; }
</style>
</head>
<body>
<div id="stage" role="button" tabindex="0" aria-label="Add a glowing light. Tap anywhere, or press Space.">
  <canvas id="sky"></canvas>
  <div id="hint">Tap anywhere</div>
</div>
<script>
(() => {
  const BACKGROUND = '#070a14';
  const COLORS = ['#ffcf6b', '#6bd6ff', '#ff7fb0', '#9d8cff', '#7dffc0', '#ff9a62'];
  const MAX_DOTS = 150;
  const FADE_OUT = 1.5; // seconds a retired dot takes to disappear
  const root = document.documentElement;
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d', { alpha: false });
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let width = 0, height = 0, scale = 1, sprites = [], dots = [], nextColor = 0, last = 0;

  // One pre-drawn glow per colour, so a full sky stays cheap to draw.
  function makeSprites() {
    const size = Math.ceil(128 * scale);
    sprites = COLORS.map((color) => {
      const sprite = document.createElement('canvas');
      sprite.width = sprite.height = size;
      const c = sprite.getContext('2d');
      const glow = c.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      glow.addColorStop(0, '#fff');
      glow.addColorStop(0.1, '#fff');
      glow.addColorStop(0.2, color);
      glow.addColorStop(0.45, color + '40');
      glow.addColorStop(1, color + '00');
      c.fillStyle = glow;
      c.fillRect(0, 0, size, size);
      return sprite;
    });
  }

  function resize() {
    const box = stage.getBoundingClientRect();
    if (!box.width || !box.height) return;
    const nextScale = Math.min(devicePixelRatio || 1, 2);
    if (width && height) {
      for (const dot of dots) {
        dot.x *= box.width / width;
        dot.y *= box.height / height;
      }
    }
    width = box.width;
    height = box.height;
    canvas.width = Math.round(width * nextScale);
    canvas.height = Math.round(height * nextScale);
    if (nextScale !== scale || !sprites.length) {
      scale = nextScale;
      makeSprites();
    }
  }

  function addDot(x, y) {
    dots.push({
      x, y,
      size: 44 + Math.random() * 40,
      heading: Math.random() * Math.PI * 2,
      speed: (6 + Math.random() * 8) * (calm ? 0.35 : 1),
      turn: 0,
      phase: Math.random() * Math.PI * 2,
      age: 0,
      leaving: 0,
      sprite: nextColor++ % COLORS.length,
    });
    root.classList.add('lit');
    let excess = dots.filter((dot) => !dot.leaving).length - MAX_DOTS;
    for (const dot of dots) {
      if (excess <= 0) break;
      if (!dot.leaving) { dot.leaving = 0.001; excess--; }
    }
  }

  function step(dot, dt) {
    dot.age += dt;
    dot.turn += (Math.random() - 0.5) * 2 * dt;
    dot.turn *= 1 - Math.min(dt, 1);
    dot.heading += dot.turn * dt;
    dot.x += Math.cos(dot.heading) * dot.speed * dt;
    dot.y += Math.sin(dot.heading) * dot.speed * dt;
    // Wrap only once the whole glow is off screen, so nothing pops at an edge.
    const margin = dot.size;
    if (dot.x < -margin) dot.x = width + margin;
    else if (dot.x > width + margin) dot.x = -margin;
    if (dot.y < -margin) dot.y = height + margin;
    else if (dot.y > height + margin) dot.y = -margin;
    if (dot.leaving) dot.leaving += dt;
  }

  function frame(now) {
    const dt = Math.min((now - last) / 1000 || 0, 0.05);
    last = now;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = BACKGROUND;
    ctx.fillRect(0, 0, width, height);
    ctx.globalCompositeOperation = 'lighter';
    dots = dots.filter((dot) => dot.leaving < FADE_OUT);
    for (const dot of dots) {
      step(dot, dt);
      const bloom = 1 + 0.7 * Math.max(0, 1 - dot.age / 0.6) ** 2;
      const twinkle = calm ? 0.9 : 0.8 + 0.2 * Math.sin(dot.age * 1.4 + dot.phase);
      const fade = dot.leaving ? Math.max(0, 1 - dot.leaving / FADE_OUT) : 1;
      const size = dot.size * bloom;
      ctx.globalAlpha = twinkle * fade;
      ctx.drawImage(sprites[dot.sprite], dot.x - size / 2, dot.y - size / 2, size, size);
    }
    requestAnimationFrame(frame);
  }

  stage.addEventListener('click', (event) => {
    const box = stage.getBoundingClientRect();
    addDot(event.clientX - box.left, event.clientY - box.top);
  });
  stage.addEventListener('keydown', (event) => {
    if (event.repeat || (event.key !== ' ' && event.key !== 'Enter')) return;
    event.preventDefault();
    addDot(Math.random() * width, Math.random() * height);
  });

  // Abstracts host handshake: content mode reports a fixed natural height;
  // viewport mode fills the frame and stops reporting.
  let viewportMode = parent === window;
  const postHeight = () => {
    if (viewportMode) return;
    parent.postMessage({ abstractsHeight: Math.ceil(document.body.getBoundingClientRect().height) }, '*');
  };
  function setLayout(mode) {
    viewportMode = mode === 'viewport';
    root.classList.toggle('viewport', viewportMode);
    resize();
    postHeight();
  }
  addEventListener('message', (event) => {
    if (event.source !== parent || parent === window) return;
    const mode = event.data && event.data.abstractsLayout;
    if (mode === 'viewport') {
      setLayout(mode);
      parent.postMessage({ abstractsLayout: 'viewport' }, '*');
    } else if (mode === 'content') {
      setLayout(mode);
    }
  });

  root.classList.toggle('viewport', viewportMode);
  resize();
  new ResizeObserver(() => { resize(); postHeight(); }).observe(stage);
  addEventListener('load', postHeight);
  if (parent !== window) parent.postMessage({ abstractsLayout: 'request' }, '*');
  requestAnimationFrame((now) => { last = now; frame(now); });
})();
</script>
</body>
</html>
